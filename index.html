<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>조달청입니다. 어떻게 도와드릴까요</title>
    <!-- 창 전체를 게임 화면으로 쓰는 템플릿. 도트 배율은 게임 안의 PixelScaler가 정수배로 맞추고 남는 곳은 레터박스. -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #241a12; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #241a12; outline: none; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        color: #f4e7c9; font: 16px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; text-align: center; padding: 0 16px; }
      #boot .title { font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
      #boot .bar { width: min(320px, 80vw); height: 14px; border: 2px solid #f4e7c9; padding: 2px; box-sizing: border-box; }
      #boot .fill { height: 100%; width: 0; background: #e3a93b; transition: width 0.15s; }
      #boot .sub { font-size: 13px; color: #cdb98f; }
      #boot.err .bar { display: none; }
      #boot.err .sub { color: #ffb3a8; max-width: 520px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="boot">
      <div class="title">조달청입니다. 어떻게 도와드릴까요?</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="sub" id="sub">창구를 여는 중… 0%</div>
    </div>
    <script>
      var boot = document.getElementById("boot"), fill = document.getElementById("fill"), sub = document.getElementById("sub");
      function fail(msg) { boot.className = "err"; boot.style.display = "flex"; sub.textContent = msg; }
      if (location.protocol === "file:") {
        // 웹 빌드는 브라우저 보안 때문에 파일을 더블클릭해서는 열리지 않는다.
        fail("이 웹 버전은 웹 서버(또는 게임 배포 사이트)에서 열어야 실행됩니다. 내려받아 바로 하시려면 PC 실행파일(HowCanIHelpYou.exe)을 이용해 주세요.");
      } else {
        var s = document.createElement("script");
        s.src = "Build/HowCanIHelpYou.loader.js";
        s.onerror = function () { fail("게임 파일을 불러오지 못했습니다. 새로고침해 주세요."); };
        s.onload = function () {
          createUnityInstance(document.querySelector("#unity-canvas"), {
            arguments: [],
            dataUrl: "Build/HowCanIHelpYou.data.unityweb",
            frameworkUrl: "Build/HowCanIHelpYou.framework.js.unityweb",
            codeUrl: "Build/HowCanIHelpYou.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Bichuk",
            productName: "조달청입니다. 어떻게 도와드릴까요",
            productVersion: "1.0",
            autoSyncPersistentDataPath: true,
            showBanner: function (msg, type) { if (type === "error") console.error(msg); },
          }, function (p) {
            var pct = Math.round(p * 100);
            fill.style.width = pct + "%";
            sub.textContent = "창구를 여는 중… " + pct + "%";
          }).then(function () {
            boot.style.display = "none";
            document.querySelector("#unity-canvas").focus();
          }).catch(function (message) {
            fail("실행하지 못했습니다: " + message);
          });
        };
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
